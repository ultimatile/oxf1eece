[project]
name = "oxf1eece"
version = "0.1.0"
description = "Find English words and adjective+noun tags spellable in hexadecimal (hexspeak)"
readme = "README.md"
authors = [
    { name = "ultimatile", email = "ultimatile@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
oxf1eece = "oxf1eece:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests", "scripts"]
extraPaths = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "PTH"]
